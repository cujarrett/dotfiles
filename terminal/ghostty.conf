# Ghostty settings. ~/.config/ghostty/config includes this file.
# Reload: cmd+shift+,

font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-thicken = true
adjust-cell-height = 8%

background-opacity = 0.94
background-blur = 20

window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
macos-titlebar-style = tabs

cursor-style = bar
unfocused-split-opacity = 0.85

window-save-state = always
window-inherit-working-directory = true
mouse-hide-while-typing = true
shell-integration = detect

# Keeps a highlighted token off the clipboard, which syncs to other devices.
copy-on-select = false

# Colors: nightshade, purple-black with a green prompt.
background = #120b1d
foreground = #ece6f5
cursor-color = #5cf28e
cursor-text = #120b1d
selection-background = #1e5c37
selection-foreground = #ffffff
split-divider-color = #1e5c37
palette = 0=#21222c
palette = 1=#ff5555
palette = 2=#50fa7b
palette = 3=#f1fa8c
palette = 4=#bd93f9
palette = 5=#ff79c6
palette = 6=#8be9fd
palette = 7=#f8f8f2
palette = 8=#6e7cb0
palette = 9=#ff6e6e
palette = 10=#69ff94
palette = 11=#ffffa5
palette = 12=#d6acff
palette = 13=#ff92df
palette = 14=#a4ffff
palette = 15=#ffffff
